# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-rpi-net-monitor"
BBFILE_PATTERN_meta-rpi-net-monitor = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-rpi-net-monitor = "6"

LAYERDEPENDS_meta-rpi-net-monitor = "core"
LAYERSERIES_COMPAT_meta-rpi-net-monitor = "kirkstone"
